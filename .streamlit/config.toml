# American Airlines palette as published in public brand-colour references (blue 0078D2, red C30019, slate 36495A,
# greys 9DA6AB and D0DAE0). Colours only: no logo, no Flight Symbol (trademarks), no AA typeface (not licensed).
[theme]
base = "light"
primaryColor = "#0078D2"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f5f8"
textColor = "#36495A"
linkColor = "#0078D2"
borderColor = "#D0DAE0"
baseRadius = "4px"
font = "sans serif"
headingFont = "sans serif"

[theme.sidebar]
backgroundColor = "#00467F"
secondaryBackgroundColor = "#0b5a9a"
textColor = "#ffffff"
primaryColor = "#ffffff"
borderColor = "#00467F"
linkColor = "#ffffff"

[server]
headless = true

[client]
toolbarMode = "minimal"
