<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#1f2937;stroke-width:1.2;rx:6}
      .soft{fill:#f3f4f8;stroke:#9ca3af;stroke-width:1;stroke-dasharray:5 4;rx:8}
      .aa{fill:#fff7ed;stroke:#c2410c;stroke-width:1;stroke-dasharray:4 3;rx:6}
      .title{font-weight:700;font-size:14px;fill:#111827}
      .sub{fill:#4b5563;font-size:11.5px}
      .lane{fill:#2b4acb;font-weight:700;font-size:12px;letter-spacing:.04em}
      .arrow{stroke:#4b5563;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <text x="24" y="28" class="title" font-size="18">fairshare: one semantic layer, one agent harness, every number with its query</text>
  <text x="24" y="46" class="sub">Solid boxes run in the demo. Dashed orange boxes are where the same pieces live at an airline (not built here).</text>

  <!-- lanes -->
  <text x="24" y="86" class="lane">SOURCES</text>
  <text x="24" y="206" class="lane">LAKEHOUSE (Databricks Free Edition, Unity Catalog aa_demo)</text>
  <text x="24" y="356" class="lane">AGENTS</text>
  <text x="24" y="516" class="lane">SURFACES</text>

  <!-- sources -->
  <rect x="24" y="96" width="200" height="72" class="box"/>
  <text x="36" y="118" class="title">BTS T-100 (real)</text>
  <text x="36" y="136" class="sub">seats by carrier, route, month</text>
  <text x="36" y="152" class="sub">AA seat share = fair share</text>

  <rect x="244" y="96" width="220" height="72" class="box"/>
  <text x="256" y="118" class="title">Synthetic agency layer</text>
  <text x="256" y="136" class="sub">12 agencies, 10 corporates, 12 markets</text>
  <text x="256" y="152" class="sub">monthly sales, goals, ticket-level bookings</text>

  <rect x="484" y="96" width="160" height="72" class="box"/>
  <text x="496" y="118" class="title">4 agreements</text>
  <text x="496" y="136" class="sub">markdown, page markers</text>
  <text x="496" y="152" class="sub">UC volume ops.contracts</text>

  <rect x="700" y="96" width="456" height="72" class="aa"/>
  <text x="712" y="118" class="title">At AA: Fabric Data Factory lands Sabre/GDS, agency portal, corporate feeds in OneLake</text>
  <text x="712" y="136" class="sub">Databricks reads OneLake through a Unity Catalog connection (catalog federation); Teradata history migrates once</text>
  <text x="712" y="152" class="sub">Demo stand-in: CSVs dropped into the landing volume</text>

  <!-- lakehouse -->
  <rect x="24" y="216" width="150" height="110" class="box"/>
  <text x="36" y="238" class="title">bronze</text>
  <text x="36" y="256" class="sub">files as landed</text>
  <rect x="194" y="216" width="150" height="110" class="box"/>
  <text x="206" y="238" class="title">silver</text>
  <text x="206" y="256" class="sub">typed, UPPER(TRIM(channel)),</text>
  <text x="206" y="272" class="sub">QUALIFY dedup of tickets</text>
  <rect x="364" y="216" width="190" height="110" class="box"/>
  <text x="376" y="238" class="title">gold</text>
  <text x="376" y="256" class="sub">fact_agency_sales_monthly</text>
  <text x="376" y="272" class="sub">fact_market_capacity (T-100)</text>
  <text x="376" y="288" class="sub">dims, goals, pace, weekly bookings</text>

  <rect x="580" y="216" width="270" height="110" class="box" stroke="#2b4acb" stroke-width="2"/>
  <text x="592" y="238" class="title">metric view gold.sales_metrics</text>
  <text x="592" y="256" class="sub">aa_share, fair_share, share_gap, YoY (window)</text>
  <text x="592" y="272" class="sub">defined once; MEASURE() at any grain</text>
  <text x="592" y="288" class="sub">ops.kpi_definitions: English, YAML, DAX twin</text>
  <text x="592" y="304" class="sub">ops.kpi_parity: nightly metric view vs twin</text>

  <rect x="876" y="216" width="280" height="110" class="box"/>
  <text x="888" y="238" class="title">ops.decomposition</text>
  <text x="888" y="256" class="sub">volume + mix + share = delta, exactly</text>
  <text x="888" y="272" class="sub">fair-share diagnostic per market</text>
  <text x="888" y="296" class="sub">Lakeflow job: nightly rebuild, Monday summary task</text>

  <!-- agents -->
  <rect x="24" y="366" width="240" height="120" class="box"/>
  <text x="36" y="388" class="title">Genie Agent</text>
  <text x="36" y="406" class="sub">over the metric view + two dims</text>
  <text x="36" y="422" class="sub">20 benchmark questions, trusted SQL</text>
  <text x="36" y="438" class="sub">called as the user (per-user identity)</text>

  <rect x="290" y="366" width="560" height="120" class="box" stroke="#2b4acb" stroke-width="2"/>
  <text x="302" y="388" class="title">Harness: Microsoft Agent Framework (laptop in dev, Foundry Hosted Agent for the demo)</text>
  <text x="302" y="408" class="sub">tools: ask_metrics (Genie)  |  run_sql (read-only fallback)  |  explain_change (decomposition)  |  search_contracts</text>
  <text x="302" y="426" class="sub">rules: numbers only from tool results; cite the SQL; "Could not verify" for everything else</text>
  <text x="302" y="446" class="sub">verifier (deterministic): every number in the draft matched to a query result; unmatched sentences quarantined</text>
  <text x="302" y="466" class="sub">model: gpt-4.1-mini in Foundry (Databricks serving endpoint as fallback)  |  traces: OpenTelemetry to MLflow</text>

  <rect x="876" y="366" width="280" height="120" class="box"/>
  <text x="888" y="388" class="title">Governance loop</text>
  <text x="888" y="406" class="sub">benchmark before every change (pre-commit hook)</text>
  <text x="888" y="422" class="sub">LLM judge: "supported by the SQL result"</text>
  <text x="888" y="438" class="sub">traces per answer; incident log</text>
  <text x="888" y="454" class="sub">hook blocks DROP/DELETE; CLAUDE.md rules</text>
  <text x="888" y="470" class="sub">public repo, pull requests</text>

  <!-- surfaces -->
  <rect x="24" y="526" width="420" height="90" class="box"/>
  <text x="36" y="548" class="title">This app (Streamlit, on the laptop)</text>
  <text x="36" y="566" class="sub">Monday summary with badges and approve step  |  Why  |  Ask  |  Definitions and parity  |  Under the hood</text>
  <text x="36" y="582" class="sub">"how I got this" drawer: SQL, rows, sources, trace link</text>

  <rect x="470" y="526" width="686" height="90" class="aa"/>
  <text x="482" y="548" class="title">At AA: Teams through Copilot Studio  |  Power BI through the mirrored Databricks catalog  |  the agency portal (each agency sees itself)</text>
  <text x="482" y="566" class="sub">Monday summary posts to Teams or mail after a human approves; the SVP gets the same page every week</text>
  <text x="482" y="582" class="sub">the metric view and the Power BI model are kept equal by the parity job; a definition change is a pull request with a test</text>

  <!-- arrows -->
  <path d="M124,168 L124,216" class="arrow"/>
  <path d="M354,168 L300,216" class="arrow"/>
  <path d="M564,168 L600,216" class="arrow"/>
  <path d="M174,270 L194,270" class="arrow"/>
  <path d="M344,270 L364,270" class="arrow"/>
  <path d="M554,270 L580,270" class="arrow"/>
  <path d="M850,270 L876,270" class="arrow"/>
  <path d="M700,326 L144,366" class="arrow"/>
  <path d="M715,326 L560,366" class="arrow"/>
  <path d="M1016,326 L720,366" class="arrow"/>
  <path d="M264,426 L290,426" class="arrow"/>
  <path d="M570,486 L300,526" class="arrow"/>
  <path d="M600,486 L800,526" class="arrow"/>
  <path d="M850,426 L876,426" class="arrow"/>
</svg>
