        <title id="09b-numbers-gaps-title">The other four numbers, and what goes into each</title>
        <desc id="09b-numbers-gaps-desc">Share gap in points, share gap in dollars, year over year and pace, each beside how it is calculated and its value for Harbor Business Travel in Sep 2026, then where the seven numbers live: six as measures in the metric view gold.sales_metrics and pace in gold.agency_pace, read by Genie, the dashboard and Ask.</desc>
