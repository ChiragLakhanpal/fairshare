        <text x="40" y="100" fill="#36495a" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif">The other four numbers, and what goes into each</text>
        <text letter-spacing="0.14em" x="1216" y="152" fill="#5a7181" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">HARBOR, SEP 2026</text>
        <g data-card="share_gap_pts"><rect x="40" y="168" width="1200" height="82" rx="6" fill="#ffffff" stroke="#d0dae0" stroke-width="1"/><text x="64" y="217" fill="#36495a" font-size="22" font-weight="600" font-family="'Inter', system-ui, sans-serif" data-name="share_gap_pts">Share gap in points</text></g>
        <text x="320" y="216" fill="#36495a" font-size="20" font-family="'Inter', system-ui, sans-serif" data-def="share_gap_pts">The share gap in points is AA share minus fair share.</text>
        <text x="1216" y="218" fill="#36495a" font-size="26" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="end" data-value="share_gap_pts">-5.9 points</text>
        <g data-card="share_gap_usd"><rect x="40" y="260" width="1200" height="82" rx="6" fill="#ffffff" stroke="#d0dae0" stroke-width="1"/><text x="64" y="309" fill="#36495a" font-size="22" font-weight="600" font-family="'Inter', system-ui, sans-serif" data-name="share_gap_usd">Share gap in dollars</text></g>
        <text x="320" y="294.5" fill="#36495a" font-size="20" font-family="'Inter', system-ui, sans-serif" data-def="share_gap_usd">The share gap in dollars is AA revenue</text>
        <text x="320" y="321.5" fill="#36495a" font-size="20" font-family="'Inter', system-ui, sans-serif" data-def="share_gap_usd">minus what fair share would have brought in.</text>
        <text x="1216" y="310" fill="#36495a" font-size="26" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="end" data-value="share_gap_usd">-$56,961</text>
        <g data-card="yoy_revenue_pct"><rect x="40" y="352" width="1200" height="82" rx="6" fill="#ffffff" stroke="#d0dae0" stroke-width="1"/><text x="64" y="401" fill="#36495a" font-size="22" font-weight="600" font-family="'Inter', system-ui, sans-serif" data-name="yoy_revenue_pct">Year over year</text></g>
        <text x="320" y="400" fill="#36495a" font-size="20" font-family="'Inter', system-ui, sans-serif" data-def="yoy_revenue_pct">Year over year compares AA revenue with the same month last year.</text>
        <text x="1216" y="402" fill="#36495a" font-size="26" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="end" data-value="yoy_revenue_pct">-16.4%</text>
        <g data-card="pace_pct"><rect x="40" y="444" width="1200" height="82" rx="6" fill="#ffffff" stroke="#d0dae0" stroke-width="1"/><text x="64" y="493" fill="#36495a" font-size="22" font-weight="600" font-family="'Inter', system-ui, sans-serif" data-name="pace_pct">Pace</text></g>
        <text x="320" y="478.5" fill="#36495a" font-size="20" font-family="'Inter', system-ui, sans-serif" data-def="pace_pct">Pace is revenue so far this year divided by the goal so far,</text>
        <text x="320" y="505.5" fill="#36495a" font-size="20" font-family="'Inter', system-ui, sans-serif" data-def="pace_pct">counting only the months the agency reported. The goals are made up.</text>
        <text x="1216" y="494" fill="#36495a" font-size="26" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="end" data-value="pace_pct">96.1%</text>
        <rect x="40" y="544" width="1200" height="128" rx="6" fill="#f2f5f8"/>
        <svg x="64" y="566" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M.95 14.184L12 20.403l9.919-5.55v2.21L12 22.662l-10.484-5.96-.565.308v.77L12 24l11.05-6.218v-4.317l-.515-.309L12 19.118l-9.867-5.653v-2.21L12 16.805l11.05-6.218V6.32l-.515-.308L12 11.974 2.647 6.681 12 1.388l7.76 4.368.668-.411v-.566L12 0 .95 6.27v.72L12 13.207l9.919-5.55v2.26L12 15.52 1.516 9.56l-.565.308Z" fill="#5a7181"/></svg>
        <text x="100" y="590" fill="#36495a" font-size="17" font-weight="400" font-family="'Inter', system-ui, sans-serif" data-where="">Six of the seven numbers are measures in the metric view gold.sales_metrics, worked out from the gold tables when a query runs,</text>
        <text x="100" y="614" fill="#36495a" font-size="17" font-weight="400" font-family="'Inter', system-ui, sans-serif" data-where="">so a share comes out right at any grouping. Pace is stored in gold.agency_pace, because its goal is set per agency and year.</text>
        <text x="100" y="638" fill="#36495a" font-size="17" font-weight="600" font-family="'Inter', system-ui, sans-serif" data-where="">Genie, the dashboard and Ask read the six from that one metric view, so their numbers agree.</text>
      </svg>
