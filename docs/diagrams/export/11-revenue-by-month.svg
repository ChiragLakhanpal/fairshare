        <title id="11-revenue-by-month-title">AA revenue by month</title>
        <desc id="11-revenue-by-month-desc">Two lines of AA revenue by calendar month, 2025 against 2026: 2026 runs above 2025 except in Mar and Apr 2026, when Sunbelt sent nothing and Harbor's AA revenue fell, though the other agencies grew in total.</desc>
