<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #ffffff;
      --color-ink: #36495a;
      --color-muted: #5a7181;
      --color-soft: #566d7b;
      --color-accent: #006cbf;
      --color-rule: rgba(54,73,90,0.14);
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 600ms;
      --motion-hold: 900ms;
      --motion-total: 6300ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1360px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 600 32px/1.15 var(--font-sans); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 1280px; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. body is a centred
       grid, so the root needs max-width/min-width to stop the grid item from
       sizing itself to the SVG's max-content width. */
    [data-motion-root] { max-width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .draw-path {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      pointer-events: none;
    }
    .motion-ready .draw-path.is-visible {
      animation: draw-path var(--motion-step) linear forwards;
    }
    .flow-token { opacity: 0; pointer-events: none; }
    .motion-ready.is-playing .flow-token.is-visible {
      opacity: 1;
      animation: token-flow 3.2s linear 1 forwards;
    }
    .motion-ready[data-motion-mode="loop"].is-playing .flow-token.is-visible {
      animation-iteration-count: infinite;
    }
    @keyframes draw-path { to { stroke-dashoffset: 0; } }
    @keyframes token-flow {
      0% { transform: translateX(0); }
      100% { transform: translateX(240px); }
    }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      /* Paper has no scrollbar, so the local scroller would clip instead of
         scroll. Let the diagram scale down to the sheet: smaller but whole
         beats sharp but cut off. */
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }
    .motion-ready [data-motion-item] { transform: none; }
    /* html[data-embed]: set by the /present deck once the controller is ready; only the figure shows, fitted to the frame */
    html[data-embed] body { margin: 0; padding: 0; min-height: 0; display: block; overflow: hidden; background: var(--color-paper); }
    html[data-embed] .eyebrow, html[data-embed] h1, html[data-embed] [data-motion-controls] { display: none !important; }
    html[data-embed] [data-motion-root] { width: 100vw; max-width: none; margin: 0; }
    html[data-embed] .diagram-container { overflow: hidden; }
    html[data-embed] [data-motion-root] svg { width: 100vw; min-width: 0; height: auto; display: block; }
    html[data-embed] [data-brand="aa-logo"] { display: none; }
    /* a step not reached yet is invisible, not faded; 01's slabs stay, assembled, and lift on each press. On step 0, where a
       slide arrives, nothing fades: the deck shows the frame at once, so a fade would play out in front of the room */
    html[data-embed] .motion-ready [data-motion-item]:not(.is-visible):not([data-part]) { opacity: 0; }
    html[data-embed] .motion-ready[data-frame="start"] [data-motion-item] { transition: none; }
    /* draw-in for charts, once, when the deck switches the page to embed mode: a line (a path with pathLength="1") traces
       left to right, a dot fades in after its line, and a bar grows from its baseline */
    html[data-embed] .draw-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: aa-draw-line 900ms ease-out forwards; }
    html[data-embed] .draw-dot { opacity: 0; animation: aa-draw-dot 300ms ease-out 900ms forwards; }
    html[data-embed] .draw-bar { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: aa-draw-bar 600ms ease-out forwards; }
    /* the newest item leads: the words of an item marked data-recede are ink while it is the current step and go back to the muted text once
       a later step arrives, and a mark in it marked data-lead (a card's outline, drawn with no stroke) is outlined in blue only while it is
       current, as a native slide's newest tile is, all over the plugin's step time. A text marked data-keep (a value drawn in the accent, a
       miss in red) keeps the color it is drawn in. On its own a page keeps the colors it is drawn in */
    html[data-embed] .motion-ready [data-motion-item][data-recede] text:not([data-keep]) { fill: var(--color-muted); transition: fill var(--motion-step) var(--motion-ease); }
    html[data-embed] .motion-ready [data-motion-item][data-recede].is-current text:not([data-keep]) { fill: var(--color-ink); }
    html[data-embed] .motion-ready [data-motion-item][data-recede] [data-lead] { stroke: var(--color-accent); stroke-opacity: 0; transition: stroke-opacity var(--motion-step) var(--motion-ease); }
    html[data-embed] .motion-ready [data-motion-item][data-recede].is-current [data-lead] { stroke-opacity: 1; }
    @keyframes aa-draw-line { to { stroke-dashoffset: 0; } }
    @keyframes aa-draw-dot { to { opacity: 1; } }
    @keyframes aa-draw-bar { to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) {
      html[data-embed] .draw-line, html[data-embed] .draw-dot, html[data-embed] .draw-bar { animation: none; stroke-dashoffset: 0; opacity: 1; transform: none; }
    }
  </style>
</head>

          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
