# Databricks App manifest: the FastAPI server that serves the React build and the /api routes, in the same process as the
# harness (lakehouse/app_deploy.py uploads and deploys it). Resources (warehouse, genie, model) are declared on the app and
# injected here by name; nothing workspace-specific is hardcoded. The viewer's own token does the work (user authorization:
# sql, genie, model-serving), never the app's service principal.
command: ["python", "-m", "server.main"]
env:
  - name: FAIRSHARE_BACKEND
    value: databricks
  - name: FAIRSHARE_MODEL
    value: databricks
  - name: FAIRSHARE_TRACES
    value: ""
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: warehouse
  - name: GENIE_SPACE_ID
    valueFrom: genie
  - name: DATABRICKS_MODEL
    valueFrom: model
