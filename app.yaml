# Databricks App manifest: the same Streamlit app, running inside the workspace (lakehouse/app_deploy.py uploads and deploys it).
# Resources (warehouse, genie, model) are declared on the app and injected here by name; nothing workspace-specific is hardcoded.
# The viewer's own token does the work (user authorization: sql, genie, model-serving), never the app's service principal.
command: ["streamlit", "run", "app/Home.py", "--server.port", "8000", "--server.address", "0.0.0.0", "--server.headless", "true"]
env:
  - name: FAIRSHARE_BACKEND
    value: databricks
  - name: FAIRSHARE_MODEL
    value: databricks
  - name: FAIRSHARE_TRACES
    value: ""
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: warehouse
  - name: GENIE_SPACE_ID
    valueFrom: genie
  - name: DATABRICKS_MODEL
    valueFrom: model
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
